<main class="app">
  <header>
    <div class="brand"><svg class="brand-mark" viewBox="0 0 64 80" aria-hidden="true"><path d="M32 2 61 29 32 77 3 29Z" fill="#22c4ff" stroke="#b5f6ff" stroke-width="2"/><path d="m32 2-9 27H3Zm0 0 9 27h20Z" fill="#88e7ff"/><path d="m23 29 9 48 9-48Z" fill="#0764e9"/><path d="M3 29h20l9 48Z" fill="#0aa5f9"/><path d="M41 29h20L32 77Z" fill="#1281f0"/><path d="M23 29 32 2l9 27Z" fill="#d5fbff" opacity=".6"/></svg><div><div class="brand-kicker">QUYET 1.0</div><h1>GEM <span>RUN</span></h1><p class="subtitle" id="subtitle"></p></div></div>
    <div class="replay-badge"><strong id="replayLabel"></strong><small id="replayMeta"></small></div>
  </header>
  <section class="toolbar" aria-label="Replay controls">
    <div class="control-group" id="languageControls"><span class="control-label" id="languageLabel"></span><button id="langEn" data-lang="en" aria-pressed="true">English</button><button id="langVi" data-lang="vi" aria-pressed="false">Tiếng Việt</button></div>
    <div class="control-group"><span class="control-label" id="seedLabel"></span><span class="control-group" id="seedControls"></span></div>
    <div class="control-group speed-control"><span class="control-label" id="replaySpeedLabel"></span><button data-speed="1" aria-pressed="true">1×</button><button data-speed="0.25" aria-pressed="false">0.25×</button><button data-speed="0.05" aria-pressed="false">0.05×</button></div>
    <div class="control-group controls-play"><button class="primary" id="playButton"></button><button id="restartButton" class="icon"></button></div>
    <div class="clock"><b id="clockNow">00.000</b><span id="clockTotal"></span></div>
  </section>
  <nav class="stage-track" id="stages" aria-label="Speed stages"></nav>
  <div class="mission-line"><strong id="missionText"></strong><div class="row-meta"><b id="rowMeta"></b><span id="deadlineMeta"></span></div></div>
  <div class="progress-row"><span class="progress-label">0 s</span><input type="range" id="scrubber" min="0" max="36" step="0.0001" value="0" aria-label="Recorded race time"><span class="progress-label" id="endTime"></span></div>
  <section class="grid" id="modelGrid" aria-label="Recorded model runs"></section>
  <div class="legend-line"><div class="legend-items"><span class="legend-item"><i class="swatch"></i><span id="legendHit"></span></span><span class="legend-item"><i class="swatch miss"></i><span id="legendMiss"></span></span><span class="legend-item"><i class="swatch wrong"></i><span id="legendWrong"></span></span></div><span class="render-note" id="renderNote"></span></div>
  <p class="score-note" id="scoreNote"></p>
  <details class="recorded-summary" id="summaryDetails" hidden><summary id="summaryTitle"></summary><div class="summary-body"><div class="bank-scroll"><table class="bank-table" id="bankTable"></table></div><p class="table-note" id="bankNote"></p></div></details>
  <details class="method" id="methodDetails"><summary id="methodTitle"></summary><div class="method-body"><p class="method-lead" id="methodLead"></p><ul class="method-list" id="methodList"></ul><div class="audit-grid"><div><h3 id="inputTitle"></h3><pre id="inputAudit"></pre></div><div><h3 id="outputTitle"></h3><pre id="outputAudit"></pre></div></div><details class="source-details"><summary id="sourceTitle"></summary><pre id="sourceAudit"></pre></details></div></details>
  <footer><span id="footerLeft"></span><span id="footerRight"></span></footer>
</main>

    const row=snap.lastRow,result=snap.lastResult,key=state.language+':'+(row?.id??'-')+':'+Boolean(result);if(c.eventKey===key)return;c.eventKey=key;
    c.eventKicker.textContent=tr('lastEvent')+(row?' · '+tr('row').toUpperCase()+' '+number(row.id+1):'');
    if(!row||!result){c.event.style.setProperty('--event','#abc5da');c.eventResult.textContent=tr('readyEvent');c.eventComparison.innerHTML=`<span class="event-ready">${esc(tr('readyHint'))}</span>`;c.event.dataset.result='pending';return;}
    const kind=result.collision?'rock':result.controlled_hit?'correct':result.deadline_miss?'late':'wrong',picked=row.cells[result.lane];
    const label={rock:'rockEvent',correct:'correct',late:'lateEvent',wrong:'wrongColor'}[kind],color={rock:'#ffbd9d',correct:'#8ef4bc',late:'#ffda8c',wrong:'#ffa0af'}[kind];
    c.event.style.setProperty('--event',color);c.eventResult.innerHTML=(kind==='rock'?'':`<span class="points">${kind==='correct'?'+1':'0'}</span>`)+esc(tr(label));
    const object=(value,label)=>`<span class="event-object" style="--gem:${COLORS[value]||'#a6bed2'}">${jewelSVG(value)}<span><small>${esc(label)}</small><b>${esc((WORDS[state.language][value]||value||'—').toUpperCase())}</b></span></span>`;
    c.eventComparison.innerHTML=object(row.goal,tr('target'))+'<span class="event-arrow" aria-hidden="true">→</span>'+object(picked,tr('picked'));
    c.event.dataset.result=kind;c.event.dataset.row=String(row.id);c.event.dataset.target=row.goal;c.event.dataset.picked=picked;c.event.dataset.points=String(result.controlled_hit?1:0);
  }
  function renderBank(){
    if(lastBankLanguage===state.language)return;lastBankLanguage=state.language;
    const models=activeModels().filter(model=>getBank(model.id));$('summaryDetails').hidden=!models.length;if(!models.length)return;
    const cell=(model,field)=>{const bank=getBank(model.id);return `<td>${field==='accuracy'?`<strong>${number(bank.correct)} / ${number(bank.count)}</strong> · ${number(bank.count?100*bank.correct/bank.count:0,1)}%`:`${milliseconds(bank[field])} ms`}</td>`;};
    $('bankTable').innerHTML=`<thead><tr><th>${esc(tr('bankMetric'))}</th>${models.map(m=>`<th>${esc(m.name)}</th>`).join('')}</tr></thead><tbody><tr><td>${esc(tr('accuracy'))}</td>${models.map(m=>cell(m,'accuracy')).join('')}</tr><tr><td>${esc(tr('latencyMedian'))}</td>${models.map(m=>cell(m,'p50_ms')).join('')}</tr><tr><td>${esc(tr('latencyP95'))}</td>${models.map(m=>cell(m,'p95_ms')).join('')}</tr></tbody>`;
  }
  function renderAudit(snapshots){
    if(!$('methodDetails').open)return;
    const key=state.language+':'+state.seed+':'+snapshots.map(s=>s.row?.id+':'+(s.latest?.received??'-')).join(',');if(key===lastAuditKey)return;lastAuditKey=key;
    $('inputAudit').textContent=JSON.stringify(Object.fromEntries(activeModels().map((model,i)=>[model.name,inputFor(snapshots[i].row,model.id)])),null,2);
    $('outputAudit').textContent=JSON.stringify(Object.fromEntries(activeModels().map((model,i)=>[model.name,snapshots[i].latest||{status:tr(snapshots[i].available?'ready':'pending')} ])),null,2);
  }
  function render(){
    const course=getCourse(),row=currentRow(),end=raceEnd(),finished=state.time>=end,stage=row?.stage??0;
    $('clockNow').textContent=state.time.toFixed(3).padStart(6,'0');$('clockTotal').textContent=` / ${end.toFixed(3)} s`;
    $('scrubber').max=end;$('scrubber').value=state.time;$('endTime').textContent=number(end,3)+' s';
    $('playButton').textContent=state.playing?tr('pause'):tr('play');$('playButton').setAttribute('aria-pressed',String(state.playing));$('playButton').disabled=!end;
    document.querySelectorAll('[data-seed]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.seed)===state.seed)));
    document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.speed)===state.speed)));
    $('stages').querySelectorAll('.stage').forEach((el,i)=>{const start=course.find(r=>r.stage===i)?.start??i*stageSeconds;el.disabled=start>=end;el.classList.toggle('active',i===stage);el.classList.toggle('passed',i<stage);el.setAttribute('aria-current',i===stage?'step':'false');el.style.setProperty('--fill',100*clamp((state.time-start)/stageSeconds)+'%');});
    $('missionText').textContent=!row?tr('waitingCourse'):finished?tr('raceEnded'):tr('missionText');
    $('rowMeta').textContent=row?`${tr('row')} ${number(row.id+1)}`:'—';
    $('deadlineMeta').textContent=row?` · ${number(1000*(row.end-row.start),3)} ms ${tr('deadline')}`:'';
    $('renderNote').textContent=finished?tr('renderEnd'):stage>=5?tr('renderFast'):tr('renderNormal');
    const snapshots=activeModels().map(model=>{
      const snap=snapshot(model.id),c=cards.get(model.id);c.el.classList.toggle('missing',!snap.available);c.el.classList.toggle('crashed',Boolean(snap.crashed));c.el.classList.toggle('finished',Boolean(snap.finished));
      const runtime=data.runtime?.[model.id];c.runtime.textContent=[runtime?.device?String(runtime.device).toUpperCase():'',state.language==='en'?'ENGLISH INPUT':'ĐẦU VÀO TIẾNG VIỆT'].filter(Boolean).join(' · ');
      c.reason.textContent=snap.available?'':snap.unavailable?.error||tr('pendingDetail');renderTarget(model,c,snap);renderEvent(c,snap);
      if(snap.available){
        c.hits.textContent=number(snap.counts.hits);c.misses.textContent=number(snap.counts.misses);c.wrong.textContent=number(snap.counts.wrong);
        c.response.innerHTML=snap.latestValid?`${milliseconds(snap.latestValid.response_ms)} <small>ms</small>`:'—';
        c.response.title=state.language==='en'?'Latest returned response, excluding backend errors.':'Phản hồi mới nhất đã nhận, không gồm lỗi xử lý.';
        c.status.textContent=snap.crashed?tr('gameOver'):snap.finished?tr('done'):snap.pending?tr('thinking'):snap.latest?(snap.latest.error?tr('error'):snap.latestTimely?tr('returned'):tr('late')):tr('ready');
        c.status.style.setProperty('--status-color',snap.crashed?'#ffab8b':snap.finished?model.color:snap.pending?'#82c9f0':snap.latest?(snap.latest.error?'#ff91a2':snap.latestTimely?'#8df3c7':'#ffd48b'):'#94c4e0');
        c.physical.innerHTML=`${esc(tr('physical'))}: <b>${number(snap.counts.physical)}</b>${snap.errors?` · ${esc(tr('errors'))}: ${number(snap.errors)}`:''}`;
        c.lane.innerHTML=`${esc(tr('lane'))}: <b>${esc(ACTIONS[state.language][snap.lane])}</b> · ${number(snap.completed)} ${esc(tr('completed'))}`;
        c.crash.hidden=!snap.crashed;
        if(snap.crashed){c.crash.querySelector('strong').textContent=tr('gameOver');c.crash.querySelector('span').textContent=tr('rockHit')+' · '+number(snap.time,3)+' s '+tr('survived');c.crash.querySelector('small').textContent=number(1/(snap.row.end-snap.row.start))+' '+(state.language==='en'?'rows/s':'hàng/s')+' · '+tr('row')+' '+number(snap.row.id+1);}
      }else{
        c.hits.textContent=c.misses.textContent=c.wrong.textContent=c.response.textContent='—';c.physical.textContent=tr('noScore');c.lane.textContent='';c.status.textContent=snap.unavailable?tr('unavailable'):tr('pending');c.status.style.setProperty('--status-color','#7896b2');c.crash.hidden=true;
      }
      drawScene(model,c,snap);return snap;
    });
    renderBank();renderAudit(snapshots);
  }
  function renderAt(seconds){const n=Number(seconds);if(!Number.isFinite(n))throw new TypeError('renderAt expects finite seconds');state.playing=false;state.time=clamp(n,0,raceEnd());lastFrame=null;render();return getState();}
  function setLanguage(language){
    if(!availableLanguages.includes(language))throw new RangeError('Language has no recorded runs');state.language=language;state.time=Math.min(state.time,raceEnd());if(state.time>=raceEnd())state.playing=false;buildCards();localize();render();return getState();
  }
  function setSeed(seed){
    const n=Number(seed);if(!seeds.includes(n))throw new RangeError('Seed has no recorded course');state.seed=n;state.time=Math.min(state.time,raceEnd());if(state.time>=raceEnd())state.playing=false;cards.forEach(c=>{c.targetKey='';c.eventKey='';});lastAuditKey='';buildStages();render();return getState();
  }
  function getState(){return {...state,duration:raceEnd(),scheduledDuration:duration,models:activeModels().map(model=>model.id)};}
  function frame(timestamp){if(state.playing){if(lastFrame!=null)state.time=Math.min(raceEnd(),state.time+(timestamp-lastFrame)/1000*state.speed);if(state.time>=raceEnd())state.playing=false;render();}lastFrame=timestamp;requestAnimationFrame(frame);}
  $('seedControls').innerHTML=seeds.map(seed=>`<button id="seed${seed}" data-seed="${seed}" aria-pressed="false">${seed}</button>`).join('');
  document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
  document.querySelectorAll('[data-seed]').forEach(b=>b.addEventListener('click',()=>setSeed(b.dataset.seed)));
  document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{state.speed=Number(b.dataset.speed);lastFrame=null;render();}));
  $('playButton').addEventListener('click',()=>{if(state.time>=raceEnd())state.time=0;state.playing=!state.playing;lastFrame=null;render();});
  $('restartButton').addEventListener('click',()=>renderAt(0));$('scrubber').addEventListener('input',e=>renderAt(e.target.value));
  $('methodDetails').addEventListener('toggle',()=>{lastAuditKey='';render();});
  window.addEventListener('resize',render);window.addEventListener('keydown',event=>{if(event.code==='Space'&&event.target===document.body){event.preventDefault();$('playButton').click();}});
  window.renderAt=renderAt;window.setLanguage=setLanguage;window.setSeed=setSeed;
  state.time=Math.min(state.time,raceEnd());buildCards();localize();render();
  const ready=(background.decode?background.decode():new Promise(resolve=>{if(background.complete)resolve();else{background.onload=resolve;background.onerror=resolve;}})).catch(()=>{}).then(()=>{render();return getState();});
  window.GemReplay={getState,getModelSnapshot:id=>snapshot(id),getInput:id=>inputFor(id?snapshot(id).row:currentRow(),id||activeModels()[0]?.id),data,ready};
  requestAnimationFrame(frame);
})();
</script>
